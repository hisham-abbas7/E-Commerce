<div class="product-container">
  <mat-card *ngFor="let product of products" class="product-card">
    <mat-card-header>
      <mat-card-title>{{ product.title }}</mat-card-title>
      <mat-card-subtitle>Category: {{ product.category }}</mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image [src]="product.image" alt="{{ product.title }}">
    <mat-card-content>
      <p>{{ product.description }}</p>
      <h3>💰 Price: ${{ product.price }}</h3>
      <p>⭐ Rating: {{ product.rating.rate }} ({{ product.rating.count }} reviews)</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="primary" (click)="addToCart(product)">🛒 Add to Cart</button>
      <button mat-button color="accent">🔍 View Details</button>
    </mat-card-actions>
  </mat-card>
</div>
